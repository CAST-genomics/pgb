<meta charset="utf-8">
<title>Route Layers — node 5520</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--ground:#fff;--panel:#f6f4ef;--ink:#16191b;--ink-2:#41474b;--ink-3:#6d7479;
      --rule:#ddd9d1;--accent:#1d5c60;--accent-soft:#e2ecec;
      /* an absent strand, receded toward the ground. Allele mode only. */
      --absent:#e8e8e8}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
     font:13px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace}
#panel{position:fixed;top:0;left:0;width:290px;height:100vh;display:flex;flex-direction:column;
       background:var(--panel);border-right:1px solid var(--rule);z-index:10}
#fixed{padding:16px 18px 10px}
#list{flex:1;overflow-y:auto;padding:0 18px 20px}
#stage{margin-left:290px;padding:20px;overflow:auto;height:100vh;cursor:grab}
#stage.grabbing{cursor:grabbing}
h1{font-size:14px;font-weight:600;margin:0 0 2px}
.sub{color:var(--ink-3);font-size:11px;margin:0 0 12px}
h2{font-size:10px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
   margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
button{font:inherit;font-size:11px;background:var(--ground);color:var(--ink-2);
       border:1px solid var(--rule);border-radius:3px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;justify-content:space-between;color:var(--ink-3);font-size:10.5px;margin-top:4px}

/* one row per route */
.r{display:grid;grid-template-columns:14px 3.2rem 1fr auto;gap:0 8px;align-items:center;
   padding:2px 0;font-size:11px;cursor:pointer;border-bottom:1px solid transparent}
.r:hover{color:var(--accent)}
.r input{accent-color:var(--accent);margin:0}
.r .n{color:var(--ink-3)}
.r .bar-i{height:7px;background:var(--accent);opacity:.55;border-radius:1px;min-width:1px}
.r .c{color:var(--ink-3);font-size:10px}

#stack{position:relative;width:100%;background:var(--ground)}
.layer{position:absolute;inset:0;width:100%}
.layer:first-child{position:relative}
.layer svg{display:block;width:100%;height:auto}
.layer[hidden]{display:none}
#stack.cased .layer :is(rect,path){stroke:var(--ground);stroke-width:var(--casing,2px);
                                   paint-order:stroke fill}
#status{color:var(--ink-3);font-size:10.5px;margin-top:10px;line-height:1.6}

/* --- allele-frequency colouring ------------------------------------------
   One route is one layer, so one fill per layer is exactly one allele. The
   server's per-band colour is inline, so these have to be !important.
   `g.track` keeps this off the segment-box chrome, which is `g.node`. */
#stack.allele .layer g.track :is(rect,path){fill:var(--allele,var(--absent))!important}
/* Absent strands are excluded from the scheme and recede toward the ground.
   Higher specificity than the rule above, so it wins inside a coloured route.

   `.absent` is a class this page tags on at load, NOT `[pclaiX="None"]`: an HTML
   document case-folds attribute names in a stylesheet, so `[pclaiX]` is stored as
   `[pclaix]` and never matches the SVG's attribute. It fails silently — the rules
   parse, they just never apply. Class selectors are case-sensitive; attribute ones
   here are not. */
#stack.allele .layer g.track .absent{fill:var(--absent)!important}
#stack.hide-absent .layer g.track .absent{display:none}

#legend{margin:10px 0 2px;display:none}
#ramp{height:9px;border-radius:2px;border:1px solid var(--rule)}
#ticks{position:relative;height:13px;margin-top:2px}
#ticks span{position:absolute;transform:translateX(-50%);color:var(--ink-3);font-size:9.5px;
            white-space:nowrap}
#ticks span:first-child{transform:none}
#ticks span:last-child{transform:translateX(-100%)}
</style>

<div id="panel">
  <div id="fixed">
    <h1>Route layers</h1>
    <p class="sub" id="src"></p>
    <div class="bar">
      <button id="all">all</button><button id="none">none</button>
    </div>
    <div class="bar">
      <button id="casing" aria-pressed="false">casing</button>
      <button id="segments" aria-pressed="true">segments</button>
      <button id="absent" aria-pressed="true">unplaced</button>
    </div>
    <h2>Colour</h2>
    <div class="bar">
      <button id="byPclai" aria-pressed="true">pclai</button>
      <button id="byAllele" aria-pressed="false">allele frequency</button>
    </div>
    <div id="legend">
      <div id="ramp"></div>
      <div id="ticks"></div>
    </div>
    <h2>Zoom</h2>
    <input type="range" id="zoom" min="0" max="60" value="24">
    <div class="row"><span id="zoomVal"></span><span>drag to pan</span></div>
    <div id="status"></div>
    <h2>Routes — click to show or hide</h2>
  </div>
  <div id="list"></div>
</div>

<div id="stage"><div id="stack"></div></div>

<script>
const stack = document.getElementById('stack')
const stage = document.getElementById('stage')

/* ColorBrewer YlOrRd, inlined rather than imported from src/utils/color so the
   page keeps working however it is served. Eight stops, low -> high. */
const RAMP = ['#ffffcc','#ffeda0','#fed976','#feb24c','#fd8d3c','#fc4e2a','#e31a1c','#b10026']
  .map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)))

const rampCss = t => {
  const n = RAMP.length - 1
  const x = Math.min(Math.max(t, 0), 1) * n
  const i = Math.min(Math.floor(x), n - 1), u = x - i
  return `rgb(${RAMP[i].map((v, k) => Math.round(v + (RAMP[i + 1][k] - v) * u)).join(',')})`
}

/* The ramp starts at 0.30 rather than 0: its low stops are near-white, and 70 of
   the 112 routes are singletons, so an unfloored scale would erase the singleton
   mat against the ground. */
const heat = u => rampCss(0.30 + u * 0.70)

const load = async file => {
  const svg = new DOMParser()
    .parseFromString(await (await fetch(file)).text(), 'image/svg+xml').documentElement
  svg.removeAttribute('width'); svg.removeAttribute('height')
  const layer = document.createElement('div')
  layer.className = 'layer'; layer.append(svg)
  return layer
}

;(async () => {
  const m = await (await fetch('manifest.json')).json()
  document.getElementById('src').textContent =
    `${m.strands} strands · ${m.segments} segments · ${m.routes.length} routes · ${m.routes.length} layers`

  const segments = await load('segments.svg')
  segments.classList.add('chrome')
  stack.append(segments)

  // one layer per route, route 0 (commonest) at the back
  const layers = []
  const widest = m.routes[0].strands
  for (const r of m.routes) {
    const layer = await load(r.file)
    stack.append(layer); layers.push(layer)

    /* Placement is a property of the strand and is constant along it, so one
       non-`None` band anywhere in the layer means the route has carriers the
       allele scheme can colour. A route with none is absence, not an allele. */
    const absent = layer.querySelectorAll('g.track [pclaiX="None"]')
    for (const band of absent) band.classList.add('absent')
    r.placed = layer.querySelector('g.track [pclaiX]:not([pclaiX="None"])') !== null
    r.absentStrands = new Set([...absent].map(e => e.getAttribute('trackID'))).size

    const row = document.createElement('div')
    row.className = 'r'
    row.innerHTML = `<input type="checkbox" checked><span class="n">${r.route}</span>` +
      `<span class="bar-i" style="width:${Math.max(1, r.strands / widest * 100)}%"></span>` +
      `<span class="c">${r.strands}</span>`
    row.title = `route ${r.route} — ${r.strands} strands, ${r.segments} segments, J=${r.jaccardToConsensus}`
    const box = row.querySelector('input')
    const show = on => { box.checked = on; layer.hidden = !on }
    box.onclick = e => { e.stopPropagation(); show(box.checked) }
    row.onclick = () => show(!box.checked)
    layer.dataset.row = r.route
    row.dataset.route = r.route
    document.getElementById('list').append(row)
  }

  const rows = [...document.querySelectorAll('.r')]

  const [, , vw, vh] = m.viewBox.split(/\s+/).map(Number)
  stack.style.aspectRatio = `${vw} / ${vh}`
  const zoom = document.getElementById('zoom')
  const applyZoom = () => {
    const f = Math.pow(1.1, Number(zoom.value))
    stack.style.width = `${f * 100}%`
    const px = (stage.clientWidth * f - 40) / vw * 15
    document.getElementById('zoomVal').textContent = `${f.toFixed(1)}x · band ${px.toFixed(2)} px`
    stack.style.setProperty('--casing', `${Math.max(0.5, px * 0.35).toFixed(2)}px`)
  }
  zoom.oninput = applyZoom; applyZoom()

  let drag = null
  stage.onpointerdown = e => {
    drag = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop }
    stage.classList.add('grabbing'); stage.setPointerCapture(e.pointerId)
  }
  stage.onpointermove = e => {
    if (!drag) return
    stage.scrollLeft = drag.l - (e.clientX - drag.x); stage.scrollTop = drag.t - (e.clientY - drag.y)
  }
  stage.onpointerup = () => { drag = null; stage.classList.remove('grabbing') }

  const setAll = on => rows.forEach((r, i) => {
    r.querySelector('input').checked = on; layers[i].hidden = !on
  })
  document.getElementById('all').onclick = () => setAll(true)
  document.getElementById('none').onclick = () => setAll(false)

  const toggle = (id, fn) => {
    const b = document.getElementById(id)
    b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'
                        b.setAttribute('aria-pressed', String(on)); fn(on) }
  }
  toggle('casing', on => stack.classList.toggle('cased', on))
  toggle('segments', on => { segments.hidden = !on })
  toggle('absent', on => stack.classList.toggle('hide-absent', !on))
  document.getElementById('segments').setAttribute('aria-pressed', 'true')
  document.getElementById('absent').setAttribute('aria-pressed', 'true')

  /* --- colour mode --------------------------------------------------------
     Two colourings of one drawing, never two drawings: `unplaced` is what
     hides data, and it works the same in both modes.

     The scale's domain is the routes that have carriers to colour. The seven
     all-absent routes are left out of it, so the top of the ramp is route 0's
     124 and the second stop is route 2's 44 — not route 1's 70, which would
     otherwise calibrate a scale it can never appear on. A route's allele count
     stays its full strand count; excluding a route is not subtracting its
     strands. */
  const legend = document.getElementById('legend')
  const statusEl = document.getElementById('status')
  const elementCount = stack.querySelectorAll('rect,path').length

  const withCarriers = m.routes.filter(r => r.placed)
  const maxCount = Math.max(...withCarriers.map(r => r.strands))
  const logMax = Math.log2(maxCount)
  const scale = n => (logMax ? Math.log2(n) / logMax : 1)
  let mode = 'pclai'

  const paint = () => {
    m.routes.forEach((r, i) => {
      const bar = rows[i].querySelector('.bar-i')
      if (mode !== 'allele') {
        layers[i].style.removeProperty('--allele')
        bar.style.background = ''; bar.style.opacity = ''
        return
      }
      const colour = r.placed ? heat(scale(r.strands)) : 'var(--absent)'
      if (r.placed) layers[i].style.setProperty('--allele', colour)
      else layers[i].style.removeProperty('--allele')
      bar.style.background = colour; bar.style.opacity = '1'
    })

    const stops = Array.from({ length: 13 }, (_, k) => heat(k / 12))
    document.getElementById('ramp').style.background =
      `linear-gradient(to right, ${stops.join(',')})`
    const ticks = document.getElementById('ticks')
    ticks.innerHTML = ''
    for (const v of [...new Set([1, 4, 16, 64, maxCount])].filter(v => v <= maxCount)) {
      const el = document.createElement('span')
      el.textContent = v
      el.style.left = `${scale(v) * 100}%`
      ticks.append(el)
    }

    if (mode !== 'allele') {
      statusEl.textContent = `${elementCount} elements. One route, one layer.`
      return
    }
    const excluded = m.routes.filter(r => !r.placed)
    const excludedStrands = excluded.reduce((n, r) => n + r.strands, 0)
    const inside = withCarriers.reduce((n, r) => n + r.absentStrands, 0)
    statusEl.textContent =
      `${elementCount} elements. Allele frequency over ${withCarriers.length} routes, ` +
      `${maxCount} haplotypes down to 1. ${excluded.length} routes carry no placement ` +
      `(${excludedStrands} haplotypes) and are excluded from the scale` +
      (inside ? `; ${inside} more sit inside coloured routes` : '') +
      `. Casing separates strands, not routes — it slices an allele into lanes.`
  }

  const setMode = next => {
    mode = next
    stack.classList.toggle('allele', next === 'allele')
    for (const [id, want] of [['byPclai', 'pclai'], ['byAllele', 'allele']])
      document.getElementById(id).setAttribute('aria-pressed', String(next === want))
    legend.style.display = next === 'allele' ? 'block' : 'none'
    paint()
  }
  document.getElementById('byPclai').onclick = () => setMode('pclai')
  document.getElementById('byAllele').onclick = () => setMode('allele')

  setMode('pclai')
})().catch(e => { document.getElementById('status').textContent = 'failed: ' + e.message })
</script>
