<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCLAI vs Assembly Key Set Visualization</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fff;
      color: #333;
      padding: 24px;
      min-height: 100vh;
    }
    
    h1 {
      font-size: 1.25rem;
      font-weight: normal;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    
    .subtitle {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 24px;
    }
    
    /* Drop zone */
    .drop-zone {
      border: 2px dashed #a0aec0;
      border-radius: 8px;
      padding: 48px;
      text-align: center;
      margin-bottom: 24px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #2b6cb0;
      background: #f7fafc;
    }
    
    .drop-zone p {
      color: #666;
      margin-bottom: 12px;
    }
    
    .drop-zone input[type="file"] {
      display: none;
    }
    
    .drop-zone label {
      display: inline-block;
      padding: 8px 16px;
      background: #2b6cb0;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.875rem;
    }
    
    .drop-zone label:hover {
      background: #2c5282;
    }
    
    /* Chart container */
    .chart-container {
      display: none;
    }
    
    .chart-container.visible {
      display: block;
    }
    
    .row {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .node-chart {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .bar-pair {
      display: flex;
      align-items: flex-end;
      gap: 2px;
    }
    
    .bar {
      position: relative;
      width: 16px;
    }
    
    .bar-segment {
      position: absolute;
      width: 100%;
      left: 0;
    }
    
    .node-label {
      font-size: 10px;
      color: #666;
      margin-top: 4px;
    }
    
    /* Legend */
    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: #666;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .legend-swatch {
      width: 8px;
      height: 8px;
    }
    
    .legend-note {
      color: #999;
      margin-left: 8px;
    }
    
    /* Summary */
    .summary {
      margin-top: 24px;
      padding: 16px;
      background: #f7fafc;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    
    .summary h2 {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .summary ul {
      list-style: none;
      color: #555;
    }
    
    .summary li {
      margin-bottom: 4px;
    }
    
    .summary strong {
      color: #333;
    }
    
    /* Print/Save button */
    .actions {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }
    
    .actions button {
      padding: 8px 16px;
      background: #2b6cb0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.875rem;
      margin-right: 8px;
    }
    
    .actions button:hover {
      background: #2c5282;
    }
    
    /* Error message */
    .error {
      color: #c53030;
      background: #fff5f5;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      display: none;
    }
    
    .error.visible {
      display: block;
    }
    
    @media print {
      .drop-zone,
      .actions {
        display: none;
      }
      
      body {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Assembly vs PCLAI Key Sets</h1>
  <p class="subtitle" id="fileInfo">Drop a JSON file or click to select</p>
  
  <div class="error" id="errorMsg"></div>
  
  <div class="drop-zone" id="dropZone">
    <p>Drag and drop a JSON file here</p>
    <p>— or —</p>
    <label for="fileInput">Choose File</label>
    <input type="file" id="fileInput" accept=".json">
  </div>
  
  <div class="chart-container" id="chartContainer">
    <div id="chartRows"></div>
    
    <div class="legend">
      <div class="legend-item">
        <div class="legend-swatch" style="background: #a0aec0;"></div>
        <span>Shared</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background: #c05621;"></div>
        <span>Assembly only</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background: #2b6cb0;"></div>
        <span>PCLAI only</span>
      </div>
      <span class="legend-note">Left bar: Assembly | Right bar: PCLAI</span>
    </div>
    
    <div class="summary" id="summary"></div>
    
    <div class="actions">
      <button onclick="window.print()">Print / Save as PDF</button>
      <button onclick="resetView()">Load Another File</button>
    </div>
  </div>

  <script>
    // Colors
    const COLORS = {
      intersection: '#a0aec0',
      assemblyOnly: '#c05621',
      pclaiOnly: '#2b6cb0'
    };
    
    const BAR_WIDTH = 16;
    const BAR_HEIGHT = 80;
    const NODES_PER_ROW = 12;
    
    // DOM elements
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const chartContainer = document.getElementById('chartContainer');
    const chartRows = document.getElementById('chartRows');
    const fileInfo = document.getElementById('fileInfo');
    const errorMsg = document.getElementById('errorMsg');
    const summary = document.getElementById('summary');
    
    // Validation function (matching Python script logic)
    function isValidPclaiEntry(coordData) {
      if (!coordData || typeof coordData !== 'object') {
        return false;
      }
      
      const coordinates = coordData.coordinates;
      const rgb = coordData.RGB;
      
      // Check if coordinates array has exactly 2 values
      if (!Array.isArray(coordinates) || coordinates.length !== 2) {
        return false;
      }
      
      // Check if RGB array has exactly 3 values
      if (!Array.isArray(rgb) || rgb.length !== 3) {
        return false;
      }
      
      // Check if values are numeric
      try {
        const x = parseFloat(coordinates[0]);
        const y = parseFloat(coordinates[1]);
        const r = parseFloat(rgb[0]);
        const g = parseFloat(rgb[1]);
        const b = parseFloat(rgb[2]);
        
        if (isNaN(x) || isNaN(y) || isNaN(r) || isNaN(g) || isNaN(b)) {
          return false;
        }
        
        // Check RGB range
        if (r < 0 || r > 255 || g < 0 || g > 255 || b < 0 || b > 255) {
          return false;
        }
        
        return true;
      } catch (e) {
        return false;
      }
    }
    
    // Process JSON data (matching Python script logic)
    function processData(data) {
      const nodes = data.node || {};
      const rows = [];
      
      for (const [nodeId, nodeData] of Object.entries(nodes)) {
        const assembly = nodeData.assembly || [];
        const pclaiCoordinates = nodeData.pclai_coordinates;
        
        // Build set of assembly/haplotype combinations
        const assemblyCombinations = new Set();
        for (const entry of assembly) {
          const assemblyName = entry.assembly_name || '';
          const haplotype = entry.haplotype || '';
          if (assemblyName && haplotype) {
            const key = `${assemblyName}#${haplotype}`;
            assemblyCombinations.add(key);
          }
        }
        
        // Get valid PCLAI keys
        const validPclaiKeys = new Set();
        if (pclaiCoordinates) {
          for (const [coordKey, coordData] of Object.entries(pclaiCoordinates)) {
            if (isValidPclaiEntry(coordData)) {
              validPclaiKeys.add(coordKey);
            }
          }
        }
        
        // Only include nodes with assembly data
        if (assemblyCombinations.size > 0) {
          // Compute set operations
          const union = new Set([...assemblyCombinations, ...validPclaiKeys]);
          const intersection = new Set([...assemblyCombinations].filter(x => validPclaiKeys.has(x)));
          const assemblyNotPclai = new Set([...assemblyCombinations].filter(x => !validPclaiKeys.has(x)));
          const pclaiNotAssembly = new Set([...validPclaiKeys].filter(x => !assemblyCombinations.has(x)));
          
          rows.push({
            nodeId,
            assemblyTotal: assemblyCombinations.size,
            pclaiTotal: validPclaiKeys.size,
            totalKeys: union.size,
            intersection: intersection.size,
            assemblyOnly: assemblyNotPclai.size,
            pclaiOnly: pclaiNotAssembly.size
          });
        }
      }
      
      // Sort by node ID
      rows.sort((a, b) => a.nodeId.localeCompare(b.nodeId, undefined, { numeric: true }));
      
      return rows;
    }
    
    // Render chart
    function renderChart(rows, fileName) {
      // Find max value for scaling
      const maxValue = Math.max(...rows.map(r => Math.max(r.assemblyTotal, r.pclaiTotal)));
      const scale = BAR_HEIGHT / maxValue;
      
      // Clear previous content
      chartRows.innerHTML = '';
      
      // Split into rows
      for (let i = 0; i < rows.length; i += NODES_PER_ROW) {
        const rowData = rows.slice(i, i + NODES_PER_ROW);
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row';
        
        for (const node of rowData) {
          const nodeChart = document.createElement('div');
          nodeChart.className = 'node-chart';
          
          const barPair = document.createElement('div');
          barPair.className = 'bar-pair';
          
          // Assembly bar
          const assemblyBar = document.createElement('div');
          assemblyBar.className = 'bar';
          assemblyBar.style.height = `${BAR_HEIGHT}px`;
          
          // Assembly intersection segment
          const assemblyIntersection = document.createElement('div');
          assemblyIntersection.className = 'bar-segment';
          assemblyIntersection.style.height = `${node.intersection * scale}px`;
          assemblyIntersection.style.bottom = '0';
          assemblyIntersection.style.background = COLORS.intersection;
          assemblyBar.appendChild(assemblyIntersection);
          
          // Assembly only segment
          if (node.assemblyOnly > 0) {
            const assemblyOnlySeg = document.createElement('div');
            assemblyOnlySeg.className = 'bar-segment';
            assemblyOnlySeg.style.height = `${node.assemblyOnly * scale}px`;
            assemblyOnlySeg.style.bottom = `${node.intersection * scale}px`;
            assemblyOnlySeg.style.background = COLORS.assemblyOnly;
            assemblyBar.appendChild(assemblyOnlySeg);
          }
          
          barPair.appendChild(assemblyBar);
          
          // PCLAI bar
          const pclaiBar = document.createElement('div');
          pclaiBar.className = 'bar';
          pclaiBar.style.height = `${BAR_HEIGHT}px`;
          
          // PCLAI intersection segment
          const pclaiIntersection = document.createElement('div');
          pclaiIntersection.className = 'bar-segment';
          pclaiIntersection.style.height = `${node.intersection * scale}px`;
          pclaiIntersection.style.bottom = '0';
          pclaiIntersection.style.background = COLORS.intersection;
          pclaiBar.appendChild(pclaiIntersection);
          
          // PCLAI only segment
          if (node.pclaiOnly > 0) {
            const pclaiOnlySeg = document.createElement('div');
            pclaiOnlySeg.className = 'bar-segment';
            pclaiOnlySeg.style.height = `${node.pclaiOnly * scale}px`;
            pclaiOnlySeg.style.bottom = `${node.intersection * scale}px`;
            pclaiOnlySeg.style.background = COLORS.pclaiOnly;
            pclaiBar.appendChild(pclaiOnlySeg);
          }
          
          barPair.appendChild(pclaiBar);
          
          // Node label
          const label = document.createElement('div');
          label.className = 'node-label';
          label.textContent = node.nodeId;
          
          nodeChart.appendChild(barPair);
          nodeChart.appendChild(label);
          rowDiv.appendChild(nodeChart);
        }
        
        chartRows.appendChild(rowDiv);
      }
      
      // Compute summary statistics
      const totalAssemblyKeys = rows.reduce((sum, r) => sum + r.assemblyTotal, 0);
      const totalPclaiKeys = rows.reduce((sum, r) => sum + r.pclaiTotal, 0);
      const totalAllKeys = rows.reduce((sum, r) => sum + r.totalKeys, 0);
      const totalIntersection = rows.reduce((sum, r) => sum + r.intersection, 0);
      const totalAssemblyNotPclai = rows.reduce((sum, r) => sum + r.assemblyOnly, 0);
      const totalPclaiNotAssembly = rows.reduce((sum, r) => sum + r.pclaiOnly, 0);
      const nodesWithAssemblyDiscrepancies = rows.filter(r => r.assemblyOnly > 0).length;
      const nodesWithPclaiDiscrepancies = rows.filter(r => r.pclaiOnly > 0).length;
      
      summary.innerHTML = `
        <h2>Summary</h2>
        <ul>
          <li><strong>${rows.length}</strong> nodes analyzed</li>
          <li><strong>${totalAssemblyKeys.toLocaleString()}</strong> total assembly keys</li>
          <li><strong>${totalPclaiKeys.toLocaleString()}</strong> total PCLAI keys</li>
          <li><strong>${totalIntersection.toLocaleString()}</strong> keys in both (intersection)</li>
          <li><strong>${totalAssemblyNotPclai.toLocaleString()}</strong> assembly keys not in PCLAI</li>
          <li><strong>${totalPclaiNotAssembly.toLocaleString()}</strong> PCLAI keys not in assembly</li>
          <li><strong>${nodesWithPclaiDiscrepancies}</strong> of ${rows.length} nodes have PCLAI keys not in assembly</li>
        </ul>
      `;
      
      // Update file info and show chart
      fileInfo.textContent = `${fileName} — ${rows.length} nodes`;
      chartContainer.classList.add('visible');
      dropZone.style.display = 'none';
    }
    
    // Handle file
    function handleFile(file) {
      if (!file.name.endsWith('.json')) {
        showError('Please select a JSON file.');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          const rows = processData(data);
          
          if (rows.length === 0) {
            showError('No valid nodes found in the JSON file. Expected structure: { "node": { ... } }');
            return;
          }
          
          hideError();
          renderChart(rows, file.name);
        } catch (err) {
          showError(`Error parsing JSON: ${err.message}`);
        }
      };
      reader.readAsText(file);
    }
    
    // Error handling
    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }
    
    function hideError() {
      errorMsg.classList.remove('visible');
    }
    
    // Reset view
    function resetView() {
      chartContainer.classList.remove('visible');
      dropZone.style.display = 'block';
      fileInfo.textContent = 'Drop a JSON file or click to select';
      fileInput.value = '';
    }
    
    // Event listeners
    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
