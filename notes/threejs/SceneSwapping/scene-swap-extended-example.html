<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GeometryStore + LookManager (Three.js)</title>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#111}
    #ui{
      position:fixed;top:10px;left:10px;z-index:10;
      background:rgba(0,0,0,.55);color:#fff;border-radius:10px;
      padding:10px 12px;font:12px system-ui, sans-serif;backdrop-filter: blur(6px)
    }
    #ui label{margin-right:6px}
    #ui button, #ui select{margin-right:6px}
  </style>

  <!-- ES Modules via import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div style="margin-bottom:6px">
      <label><strong>Active Scene:</strong></label>
      <button data-scene="pbr">PBR</button>
      <button data-scene="toon">Toon</button>
    </div>
    <div>
      <label for="look"><strong>Look:</strong></label>
      <select id="look">
        <option value="pbr">PBR</option>
        <option value="toon">Toon</option>
        <option value="matcap">Matcap</option>
        <option value="wire">Wireframe</option>
      </select>
      <button id="warm">Warm Shaders</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ---------- Utilities ----------
    function disposeMaterial(m){
      if (!m) return;
      // dispose textures attached to the material
      for (const k in m){
        const v = m[k];
        if (v && v.isTexture) v.dispose?.();
      }
      m.dispose?.();
    }

    // ---------- GeometryStore ----------
    class GeometryStore {
      constructor(){
        /** @type {Map<string, {geom: THREE.BufferGeometry, refs: number}>} */
        this._items = new Map();
      }

      /**
       * Acquire (and create if missing) a shared geometry.
       * @param {string} key
       * @param {() => THREE.BufferGeometry} factory
       * @returns {THREE.BufferGeometry}
       */
      acquire(key, factory){
        let item = this._items.get(key);
        if (!item){
          const geom = factory();
          this._lockGeometry(geom);       // discourage accidental mutation
          item = { geom, refs: 0 };
          this._items.set(key, item);
        }
        item.refs++;
        return item.geom;
      }

      /**
       * Release a geometry reference; dispose when refcount hits 0.
       * @param {string} key
       */
      release(key){
        const item = this._items.get(key);
        if (!item) return;
        item.refs--;
        if (item.refs <= 0){
          item.geom.dispose();
          this._items.delete(key);
        }
      }

      refs(key){ return this._items.get(key)?.refs ?? 0; }

      disposeAll(){
        for (const [, item] of this._items) item.geom.dispose();
        this._items.clear();
      }

      // Debug guard: make mutating shared geometry noisy (dev safety).
      _lockGeometry(g){
        g.userData.shared = true;

        const block = (name) => {
          const orig = g[name]?.bind(g);
          if (!orig) return;
          g[name] = (...args) => {
            console.error(`[GeometryStore] Attempted to mutate shared geometry via "${name}". Clone first: const g2 = g.clone();`);
            // Intentionally do NOTHING to protect the shared geometry.
            return g;
          };
        };
        // Common mutators we'd like to prevent on the shared "truth":
        ['setAttribute','deleteAttribute','setIndex','addGroup','clearGroups','setDrawRange',
         'applyMatrix4','rotateX','rotateY','rotateZ','translate','scale','center',
         'computeVertexNormals','computeTangents','toNonIndexed','copy'].forEach(block);

        // Shallow-freeze the attributes bag (doesn't freeze TypedArrays).
        try { Object.freeze(g.attributes); } catch(_) {}
        return g;
      }
    }

    // ---------- LookManager ----------
    class LookManager {
      /**
       * @param {THREE.WebGLRenderer} renderer
       * @param {THREE.Camera} camera
       * @param {GeometryStore} geomStore
       * @param {string} geometryKey
       */
      constructor(renderer, camera, geomStore, geometryKey){
        this.renderer = renderer;
        this.camera = camera;
        this.geomStore = geomStore;
        this.geometryKey = geometryKey;

        /** @type {Map<string, ()=>THREE.Material>} materialFactories */
        this.looks = new Map();

        /** @type {Map<string, { scene: THREE.Scene, mesh: THREE.Mesh, materials: Map<string, THREE.Material> }>} */
        this.scenes = new Map();

        /** @type {string|null} */
        this.activeSceneName = null;
      }

      registerLook(name, factory){
        this.looks.set(name, factory);
      }

      /**
       * Create a scene with its own mesh that references the shared geometry.
       * @param {string} name
       * @param {(scene: THREE.Scene) => {mesh: THREE.Mesh, defaultLook: string}} sceneBuilder
       */
      createScene(name, sceneBuilder){
        if (this.scenes.has(name)) throw new Error(`Scene "${name}" already exists`);

        const scene = new THREE.Scene();
        const { mesh, defaultLook } = sceneBuilder(scene);
        if (!mesh || !mesh.isMesh) throw new Error('sceneBuilder must return { mesh, defaultLook }');

        // Attach shared geometry
        const geom = this.geomStore.acquire(this.geometryKey, ()=> {
          // default factory should never run if you pre-wired a geometry factory in app setup
          throw new Error('No geometry factory provided for GeometryStore.acquire');
        });
        mesh.geometry = geom;
        scene.add(mesh);

        const materials = new Map();
        this.scenes.set(name, { scene, mesh, materials });

        // Assign default look
        if (defaultLook) this.setLook(name, defaultLook);

        // First created scene becomes active by default
        if (!this.activeSceneName) this.activeSceneName = name;

        return scene;
      }

      setActiveScene(name){
        if (!this.scenes.has(name)) throw new Error(`Unknown scene "${name}"`);
        this.activeSceneName = name;
      }

      get activeScene(){
        return this.activeSceneName ? this.scenes.get(this.activeSceneName).scene : null;
      }

      /**
       * Set/ensure a look (material) for a given scene. Creates the material lazily per scene.
       */
      setLook(sceneName, lookName){
        const s = this.scenes.get(sceneName);
        if (!s) throw new Error(`Unknown scene "${sceneName}"`);
        if (!this.looks.has(lookName)) throw new Error(`Look "${lookName}" not registered`);

        // Reuse material instance per scene to avoid cross-scene coupling
        let mat = s.materials.get(lookName);
        if (!mat){
          mat = this.looks.get(lookName)();
          s.materials.set(lookName, mat);
        }
        s.mesh.material = mat;
        s.mesh.material.needsUpdate = true;
      }

      /**
       * Precompile shaders for a scene (prevents first-frame hitch).
       */
      warm(sceneName){
        const s = this.scenes.get(sceneName);
        if (!s) throw new Error(`Unknown scene "${sceneName}"`);
        this.renderer.compile(s.scene, this.camera);
      }

      warmAll(){
        for (const name of this.scenes.keys()) this.warm(name);
      }

      /**
       * Dispose a scene's materials and release geometry (does NOT dispose shared geometry unless refcount hits zero).
       */
      disposeScene(sceneName){
        const s = this.scenes.get(sceneName);
        if (!s) return;

        // dispose all scene-owned materials
        for (const m of s.materials.values()) disposeMaterial(m);
        s.materials.clear();

        // release shared geometry
        this.geomStore.release(this.geometryKey);

        // remove mesh from scene (geometry is shared and not disposed here)
        s.scene.remove(s.mesh);
        this.scenes.delete(sceneName);
        if (this.activeSceneName === sceneName) this.activeSceneName = null;
      }
    }

    // ---------- App Wiring ----------
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.shadowMap.enabled = true;

    const camera = new THREE.PerspectiveCamera(60, 2, 0.1, 100);
    camera.position.set(3, 2, 5);
    const controls = new OrbitControls(camera, renderer.domElement);

    function onResize(){
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    addEventListener('resize', onResize);

    // Shared geometry factory (your single "truth")
    const geometryKey = 'main';
    const geometryFactory = () => new THREE.TorusKnotGeometry(1, 0.35, 256, 32);

    const geomStore = new GeometryStore();
    // Prime the store once with a known factory:
    geomStore.acquire(geometryKey, geometryFactory);
    // (We immediately release because scenes will acquire again; this ensures a single instance is created by our factory.)
    geomStore.release(geometryKey);

    // LookManager
    const lookMgr = new LookManager(renderer, camera, geomStore, geometryKey);

    // --- Register looks (material factories) ---
    const texLoader = new THREE.TextureLoader();
    lookMgr.registerLook('pbr', () => new THREE.MeshStandardMaterial({
      color: 0x7aa2ff, roughness: 0.35, metalness: 0.6
    }));

    lookMgr.registerLook('toon', () => new THREE.MeshToonMaterial({ color: 0xff8a65 }));

    lookMgr.registerLook('matcap', () => {
      const m = new THREE.MeshMatcapMaterial();
      // lazy load matcap
      texLoader.load(
        'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/matcaps/3.png',
        t => { m.matcap = t; m.needsUpdate = true; }
      );
      return m;
    });

    lookMgr.registerLook('wire', () => new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true }));

    // --- Build scenes (each gets its own mesh but same geometry) ---
    const pmrem = new THREE.PMREMGenerator(renderer);

    // Scene: PBR
    lookMgr.createScene('pbr', (scene) => {
      scene.background = new THREE.Color(0x202025);

      // environment lighting for PBR
      const env = pmrem.fromScene(new RoomEnvironment()).texture;
      scene.environment = env;

      const amb = new THREE.AmbientLight(0xffffff, 0.25);
      const dir = new THREE.DirectionalLight(0xffffff, 2);
      dir.position.set(3,4,2); dir.castShadow = true;
      scene.add(amb, dir, new THREE.GridHelper(10, 10));

      const mesh = new THREE.Mesh(undefined, new THREE.MeshStandardMaterial({ color: 0x7aa2ff, roughness: 0.35, metalness: 0.6 }));
      mesh.castShadow = mesh.receiveShadow = true;

      return { mesh, defaultLook: 'pbr' };
    });

    // Scene: Toon
    lookMgr.createScene('toon', (scene) => {
      scene.background = new THREE.Color(0x1b1b1f);
      const amb = new THREE.AmbientLight(0xffffff, 0.25);
      const dir = new THREE.DirectionalLight(0xffffff, 2);
      dir.position.set(-2,3,2);
      scene.add(amb, dir);

      const mesh = new THREE.Mesh(undefined, new THREE.MeshToonMaterial({ color: 0xff8a65 }));
      return { mesh, defaultLook: 'toon' };
    });

    // Start on PBR
    lookMgr.setActiveScene('pbr');

    // UI handlers
    document.getElementById('ui').addEventListener('click', (e) => {
      const s = e.target.dataset.scene;
      if (!s) return;
      lookMgr.setActiveScene(s);
      // optional warm compile on switch
      lookMgr.warm(s);
    });

    const lookSelect = document.getElementById('look');
    lookSelect.addEventListener('change', () => {
      const active = lookMgr.activeSceneName || 'pbr';
      lookMgr.setLook(active, lookSelect.value);
      lookMgr.warm(active);
    });

    document.getElementById('warm').addEventListener('click', () => {
      lookMgr.warmAll();
    });

    // Animation
    onResize();
    const meshes = [...lookMgr.scenes.values()].map(s => s.mesh);
    (function animate(){
      requestAnimationFrame(animate);
      for (const m of meshes) m.rotation.y += 0.01;
      const active = lookMgr.activeScene;
      if (active) renderer.render(active, camera);
    })();

    // Cleanup on unload (example)
    addEventListener('beforeunload', () => {
      for (const [name] of lookMgr.scenes) lookMgr.disposeScene(name);
      pmrem.dispose();
      geomStore.disposeAll();
      renderer.dispose();
    });
  </script>
</body>
</html>
