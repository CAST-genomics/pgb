<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PGB — Tube Map Panel (dev)</title>
    <!--
      Dev-only, and absent from `dist/` for the reason `dev/tubemap.html` spells out.

      That page mounts the viewer alone. This one mounts the panel `mountTubeMapPanel`
      builds, over a stand-in for the graph it will float above, so that drag, the resize
      grip and fullscreen can be tried against a real map. See `src/devTubeMapPanelRoute.ts`.

      **The bare cascade**: PGB's own stylesheet and nothing else. `dev/tubemap-app.html`
      mounts the identical page under `index.html`'s full cascade, Bootstrap's reset
      included; the two differ in their `<link>` tags and in nothing else, which is what
      makes the difference between them readable as the cascade's doing (#126). Judge the
      card here; verify the layout there.
    -->
    <link rel="stylesheet" href="/src/styles/app.scss">
    <link rel="stylesheet" href="/dev/devPage.css">
</head>
<body>
    <div class="dev-picker">
        <input id="url" name="url" type="text" spellcheck="false" aria-label="Tube map URL">
        <button id="open" type="button">Open</button>
    </div>

    <div class="dev-hint">drag the header · drag the bottom-right grip to resize · ⛶ for fullscreen</div>

    <script type="module" src="/src/devTubeMapPanelRoute.ts"></script>
</body>
</html>
