<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PCLAI Coordinates — Node Coverage Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f4f0; color: #2c2c2c; min-height: 100vh; }
  header { background: #2c2c2c; color: #f5f4f0; padding: 18px 32px; display: flex; align-items: baseline; gap: 16px; }
  header h1 { font-size: 1.15rem; font-weight: normal; letter-spacing: 0.04em; }
  header span { font-size: 0.8rem; opacity: 0.5; font-family: monospace; }
  #drop-zone { margin: 40px auto; max-width: 520px; border: 2px dashed #aaa8a0; border-radius: 6px; padding: 48px 32px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; background: #fff; }
  #drop-zone.drag-over { border-color: #5a8f6a; background: #f0f7f2; }
  #drop-zone p { color: #666; font-size: 0.95rem; line-height: 1.6; }
  #drop-zone p.small { font-size: 0.78rem; color: #999; margin-top: 8px; font-family: monospace; }
  #file-input { display: none; }
  #url-row { max-width: 520px; margin: 0 auto 32px; display: flex; gap: 8px; }
  #url-input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; font-family: monospace; background: #fff; }
  #url-btn { padding: 8px 16px; background: #2c2c2c; color: #f5f4f0; border: none; border-radius: 4px; cursor: pointer; font-size: 0.82rem; }
  #error-msg { max-width: 520px; margin: 0 auto 16px; padding: 10px 14px; background: #fdf0ee; border-left: 3px solid #c0392b; font-size: 0.85rem; color: #c0392b; display: none; }
  #report { display: none; max-width: 1100px; margin: 0 auto 60px; padding: 0 24px; }
  #report-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; padding-bottom: 12px; border-bottom: 1px solid #d4d2cc; }
  #report-header h2 { font-size: 1rem; font-weight: normal; color: #555; }
  #print-btn { padding: 7px 18px; background: #f5f4f0; border: 1px solid #aaa8a0; border-radius: 4px; cursor: pointer; font-size: 0.8rem; color: #444; }
  #summary { display: flex; gap: 24px; margin-bottom: 32px; flex-wrap: wrap; }
  .stat-box { background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 14px 22px; min-width: 130px; }
  .stat-box .num { font-size: 1.6rem; font-weight: bold; color: #2c2c2c; line-height: 1; }
  .stat-box .lbl { font-size: 0.73rem; color: #888; margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .stat-box.has .num { color: #4a8f5e; }
  .stat-box.none .num { color: #a0a0a0; }
  #legend { display: flex; gap: 20px; margin-bottom: 20px; font-size: 0.78rem; color: #555; align-items: center; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 5px; }
  #chart-scroll { overflow-x: auto; background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 24px 20px 16px; }
  #tooltip { position: fixed; background: #2c2c2c; color: #f5f4f0; padding: 10px 14px; border-radius: 4px; font-size: 0.78rem; line-height: 1.6; pointer-events: none; opacity: 0; transition: opacity 0.15s; max-width: 280px; z-index: 100; }
  #tooltip .tt-id { font-family: monospace; font-weight: bold; font-size: 0.85rem; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 20px; }
  #tooltip .tt-val { font-family: monospace; }
  @media print { #drop-zone, #url-row, #print-btn { display: none !important; } #report { display: block !important; } }
</style>
</head>
<body>
<header><h1>PCLAI Coordinates — Node Coverage Report</h1><span>hello-hprc.json</span></header>
<div id="drop-zone">
  <p>Drop <strong>hello-hprc.json</strong> here<br>or click to select</p>
  <p class="small">Processed entirely in the browser — no upload</p>
  <input type="file" id="file-input" accept=".json">
</div>
<div id="url-row">
  <input type="text" id="url-input" placeholder="…or paste a URL to load JSON from">
  <button id="url-btn">Load</button>
</div>
<div id="error-msg"></div>
<div id="tooltip"></div>
<div id="report">
  <div id="report-header">
    <div><h2>Which nodes have <code>pclai_coordinates</code> with actual data?</h2><div style="font-family:monospace;font-size:.8rem;color:#999" id="source-label"></div></div>
    <button id="print-btn" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div id="summary"></div>
  <div id="legend">
    <span><span class="legend-swatch" style="background:#4a8f5e"></span>Has pclai_coordinates (with data)</span>
    <span><span class="legend-swatch" style="background:#dcdad4"></span>Absent or empty</span>
  </div>
  <div id="chart-scroll"><svg id="chart"></svg></div>
</div>
<script>
function hasCoordinateData(v) {
  if (v === null || v === undefined) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'object') return Object.keys(v).length > 0;
  return Boolean(v);
}
function coordinateCount(v) {
  if (!hasCoordinateData(v)) return 0;
  if (Array.isArray(v)) return v.length;
  if (typeof v === 'object') return Object.keys(v).length;
  return 1;
}
function processData(data) {
  const nodesRaw = data.node || {};
  const results = [];
  for (const [id, node] of Object.entries(nodesRaw)) {
    const pc = node.pclai_coordinates;
    results.push({ id, present: hasCoordinateData(pc), count: coordinateCount(pc), node });
  }
  results.sort((a,b) => { if (a.present !== b.present) return b.present - a.present; return a.id.localeCompare(b.id,undefined,{numeric:true}); });
  return results;
}
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}
function addTooltip(el, r) {
  el.style.cursor = 'default';
  el.addEventListener('mouseenter', e => {
    const pc = r.node.pclai_coordinates;
    const pcType = pc==null ? 'absent' : Array.isArray(pc) ? `array (len ${pc.length})` : typeof pc==='object' ? `object (${Object.keys(pc).length} keys)` : typeof pc;
    const tt = document.getElementById('tooltip');
    tt.innerHTML = `<div class="tt-id">${r.id}</div>
      <div class="tt-row"><span>pclai_coordinates</span><span class="tt-val">${pcType}</span></div>
      <div class="tt-row"><span>has data</span><span class="tt-val">${r.present?'✓ yes':'✗ no'}</span></div>
      ${r.present?`<div class="tt-row"><span>entry count</span><span class="tt-val">${r.count}</span></div>`:''}
      ${r.node.length!=null?`<div class="tt-row"><span>node length</span><span class="tt-val">${r.node.length}</span></div>`:''}`;
    tt.style.opacity='1'; positionTooltip(e);
  });
  el.addEventListener('mousemove', positionTooltip);
  el.addEventListener('mouseleave', () => { document.getElementById('tooltip').style.opacity='0'; });
}
function positionTooltip(e) {
  const tt = document.getElementById('tooltip');
  tt.style.left = Math.min(e.clientX+14, window.innerWidth-300)+'px';
  tt.style.top = (e.clientY-10)+'px';
}
function renderChart(results, sourceLabel) {
  const withData = results.filter(r=>r.present), maxCount = Math.max(...results.map(r=>r.count),1);
  document.getElementById('source-label').textContent = sourceLabel;
  document.getElementById('summary').innerHTML = `
    <div class="stat-box"><div class="num">${results.length}</div><div class="lbl">Total Nodes</div></div>
    <div class="stat-box has"><div class="num">${withData.length}</div><div class="lbl">Have Coordinates</div></div>
    <div class="stat-box none"><div class="num">${results.length-withData.length}</div><div class="lbl">No Coordinates</div></div>
    <div class="stat-box"><div class="num">${maxCount}</div><div class="lbl">Max Entry Count</div></div>`;
  const BW=28,GAP=8,LH=44,PT=16,PL=42,PR=16,CH=200;
  const SH=PT+CH+LH, SW=PL+results.length*(BW+GAP)-GAP+PR;
  const svg=document.getElementById('chart');
  svg.setAttribute('width',SW); svg.setAttribute('height',SH); svg.innerHTML='';
  for (let i=0;i<=5;i++) {
    const y=PT+CH-(i/5)*CH, val=Math.round((i/5)*maxCount);
    svg.appendChild(svgEl('line',{x1:PL-6,y1:y,x2:SW-PR,y2:y,stroke:'#eee','stroke-dasharray':'3,3'}));
    const t=svgEl('text',{x:PL-8,y:y+3,'text-anchor':'end','font-family':'monospace','font-size':9,fill:'#888'});
    t.textContent=val; svg.appendChild(t);
  }
  results.forEach((r,i) => {
    const x=PL+i*(BW+GAP);
    if (r.present) {
      const bh=Math.max((r.count/maxCount)*CH,4), y=PT+CH-bh;
      const rect=svgEl('rect',{x,y,width:BW,height:bh,fill:'#4a8f5e',rx:2});
      addTooltip(rect,r); svg.appendChild(rect);
      const lbl=svgEl('text',{x:x+BW/2,'text-anchor':'middle','font-size':9,fill:bh>=18?'#fff':'#555'});
      lbl.setAttribute('y',bh>=18?y+bh/2+4:y-3); lbl.textContent=r.count; svg.appendChild(lbl);
    } else {
      const rect=svgEl('rect',{x,y:PT+CH-6,width:BW,height:6,fill:'#dcdad4',rx:1});
      addTooltip(rect,r); svg.appendChild(rect);
    }
    const ly=PT+CH+6;
    const t=svgEl('text',{x:x+BW/2,y:ly,'text-anchor':'end','font-family':'monospace','font-size':9,fill:'#555',transform:`rotate(-45,${x+BW/2},${ly})`});
    t.textContent=r.id; svg.appendChild(t);
  });
  svg.appendChild(svgEl('line',{x1:PL-2,y1:PT+CH,x2:SW-PR,y2:PT+CH,stroke:'#bbb','stroke-width':1}));
  document.getElementById('report').style.display='block';
}
function showError(msg) { const el=document.getElementById('error-msg'); el.textContent=msg; el.style.display='block'; }
function loadJSON(text, label) {
  document.getElementById('error-msg').style.display='none';
  try {
    const data=JSON.parse(text), results=processData(data);
    if (!results.length) { showError('No nodes found.'); return; }
    renderChart(results,label);
    document.getElementById('drop-zone').style.display='none';
    document.getElementById('url-row').style.display='none';
  } catch(e) { showError('Could not parse JSON: '+e.message); }
}
const dz=document.getElementById('drop-zone');
dz.addEventListener('click',()=>document.getElementById('file-input').click());
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>loadJSON(ev.target.result,f.name);r.readAsText(f);});
document.getElementById('file-input').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>loadJSON(ev.target.result,f.name);r.readAsText(f);});
document.getElementById('url-btn').addEventListener('click',()=>{const url=document.getElementById('url-input').value.trim();if(!url)return;fetch(url).then(r=>r.text()).then(t=>loadJSON(t,url)).catch(e=>showError('Fetch failed: '+e.message));});
document.getElementById('url-input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('url-btn').click();});
</script>
</body>
</html>
